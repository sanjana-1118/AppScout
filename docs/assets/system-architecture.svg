<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="shopifyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95bf47"/>
      <stop offset="100%" stop-color="#5e8e3e"/>
    </linearGradient>
    <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="fastapiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="60" y1="0" x2="60" y2="680"/><line x1="180" y1="0" x2="180" y2="680"/>
    <line x1="300" y1="0" x2="300" y2="680"/><line x1="420" y1="0" x2="420" y2="680"/>
    <line x1="540" y1="0" x2="540" y2="680"/><line x1="660" y1="0" x2="660" y2="680"/>
    <line x1="780" y1="0" x2="780" y2="680"/><line x1="900" y1="0" x2="900" y2="680"/>
    <line x1="1020" y1="0" x2="1020" y2="680"/><line x1="1140" y1="0" x2="1140" y2="680"/>
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="540" x2="1200" y2="540"/><line x1="0" y1="660" x2="1200" y2="660"/>
  </g>

  <!-- Title Header -->
  <g transform="translate(60, 45)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f8fafc" letter-spacing="0.5">AppScout System Architecture</text>
    <text y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">End-to-End Pipeline: Data Ingestion → PostgreSQL Persistence → FastAPI REST API → React 19 SPA</text>
  </g>

  <!-- Stage Flow Connectors (Pillars) -->
  <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.6">
    <path d="M 230 330 L 280 330"/>
    <path d="M 500 330 L 550 330"/>
    <path d="M 730 330 L 780 330"/>
    <path d="M 960 330 L 1010 330"/>
  </g>

  <!-- Flow Arrows -->
  <g fill="#38bdf8">
    <polygon points="280,326 290,330 280,334"/>
    <polygon points="550,326 560,330 550,334"/>
    <polygon points="780,326 790,330 780,334"/>
    <polygon points="1010,326 1020,330 1010,334"/>
  </g>

  <!-- ==================== STAGE 1: SHOPIFY APP STORE ==================== -->
  <g transform="translate(50, 140)" filter="url(#cardShadow)">
    <rect width="180" height="380" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="180" height="42" rx="12" fill="#1e293b"/>
    <rect y="30" width="180" height="12" fill="#1e293b"/>
    <circle cx="28" cy="21" r="10" fill="url(#shopifyGrad)"/>
    <!-- Bag Icon Glyph -->
    <path d="M 25 18 L 31 18 L 32 25 L 24 25 Z M 27 18 A 2 2 0 0 1 29 18" stroke="#ffffff" stroke-width="1.2" fill="none"/>
    <text x="46" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Shopify Web</text>
    <text x="14" y="66" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#95bf47">EXTERNAL SOURCE</text>

    <!-- Source Items -->
    <g transform="translate(14, 85)">
      <!-- Item 1 -->
      <rect width="152" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">Category Sitemaps</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">52 Category Indexes</text>
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">45 Leaf Taxonomies</text>

      <!-- Item 2 -->
      <g transform="translate(0, 72)">
        <rect width="152" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">App Profiles</text>
        <text x="12" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">JSON-LD Metadata</text>
        <text x="12" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Structured Pricing Tiers</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 144)">
        <rect width="152" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="12" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">Merchant Reviews</text>
        <text x="12" y="35" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Paginated Review Pages</text>
        <text x="12" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">10 Reviews / Page</text>
        <text x="12" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#eab308">1,000-page web ceiling</text>
      </g>
    </g>
  </g>

  <!-- ==================== STAGE 2: INGESTION PIPELINE ==================== -->
  <g transform="translate(290, 140)" filter="url(#cardShadow)">
    <rect width="210" height="380" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="210" height="42" rx="12" fill="#1e293b"/>
    <rect y="30" width="210" height="12" fill="#1e293b"/>
    <circle cx="28" cy="21" r="10" fill="url(#pythonGrad)"/>
    <!-- Gear Glyph -->
    <circle cx="28" cy="21" r="4" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <text x="46" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Data Pipeline</text>
    <text x="14" y="66" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">PYTHON COLLECTION</text>

    <!-- Pipeline Items -->
    <g transform="translate(14, 85)">
      <!-- Item 1 -->
      <rect width="182" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">Frontier Reconciliation</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">25,633 Unique Targets</text>
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">0 Unaccounted Targets</text>

      <!-- Item 2 -->
      <g transform="translate(0, 72)">
        <rect width="182" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">Extraction &amp; Pricing</text>
        <text x="12" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">requests + BeautifulSoup4</text>
        <text x="12" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">42,326 Discrete Plan Tiers</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 144)">
        <rect width="182" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="12" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">SHA-256 Deduplication</text>
        <text x="12" y="35" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">64-char Hash Fingerprint</text>
        <text x="12" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">In-Memory Hash Pre-loading</text>
        <text x="12" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">Zero Duplicate Reviews</text>
      </g>
    </g>
  </g>

  <!-- ==================== STAGE 3: POSTGRESQL DATABASE ==================== -->
  <g transform="translate(560, 140)" filter="url(#cardShadow)">
    <rect width="170" height="380" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="170" height="42" rx="12" fill="#1e293b"/>
    <rect y="30" width="170" height="12" fill="#1e293b"/>
    <circle cx="26" cy="21" r="10" fill="url(#dbGrad)"/>
    <!-- Cylinder Glyph -->
    <ellipse cx="26" cy="18" rx="5" ry="2" stroke="#ffffff" stroke-width="1" fill="none"/>
    <path d="M 21 18 L 21 24 A 5 2 0 0 0 31 24 L 31 18" stroke="#ffffff" stroke-width="1" fill="none"/>
    <text x="44" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">PostgreSQL</text>
    <text x="14" y="66" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#3b82f6">PERSISTENCE 18.6+</text>

    <!-- Table Rows -->
    <g transform="translate(14, 85)">
      <!-- Apps -->
      <rect width="142" height="38" rx="6" fill="#0f172a" stroke="#1e3a8a" stroke-width="1"/>
      <text x="10" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#93c5fd">apps</text>
      <text x="10" y="30" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">21,502 canonical</text>

      <!-- Categories -->
      <g transform="translate(0, 46)">
        <rect width="142" height="38" rx="6" fill="#0f172a" stroke="#1e3a8a" stroke-width="1"/>
        <text x="10" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#93c5fd">categories</text>
        <text x="10" y="30" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">166 taxonomy nodes</text>
      </g>

      <!-- App Categories -->
      <g transform="translate(0, 92)">
        <rect width="142" height="38" rx="6" fill="#0f172a" stroke="#1e3a8a" stroke-width="1"/>
        <text x="10" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#93c5fd">app_categories</text>
        <text x="10" y="30" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">32,587 links (M:N)</text>
      </g>

      <!-- Pricing Plans -->
      <g transform="translate(0, 138)">
        <rect width="142" height="38" rx="6" fill="#0f172a" stroke="#1e3a8a" stroke-width="1"/>
        <text x="10" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#93c5fd">app_pricing_plans</text>
        <text x="10" y="30" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">42,326 parsed tiers</text>
      </g>

      <!-- Reviews -->
      <g transform="translate(0, 184)">
        <rect width="142" height="38" rx="6" fill="#0f172a" stroke="#1e3a8a" stroke-width="1"/>
        <text x="10" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#93c5fd">reviews</text>
        <text x="10" y="30" font-family="system-ui, sans-serif" font-size="10" fill="#10b981">738,101 reviews</text>
      </g>
    </g>
  </g>

  <!-- ==================== STAGE 4: FASTAPI REST BACKEND ==================== -->
  <g transform="translate(790, 140)" filter="url(#cardShadow)">
    <rect width="170" height="380" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="170" height="42" rx="12" fill="#1e293b"/>
    <rect y="30" width="170" height="12" fill="#1e293b"/>
    <circle cx="26" cy="21" r="10" fill="url(#fastapiGrad)"/>
    <!-- Bolt Glyph -->
    <path d="M 27 15 L 23 21 L 26 21 L 25 27 L 29 20 L 26 20 Z" fill="#ffffff"/>
    <text x="44" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">FastAPI API</text>
    <text x="14" y="66" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#10b981">REST SERVICES</text>

    <!-- Routers -->
    <g transform="translate(14, 85)">
      <!-- Router 1 -->
      <rect width="142" height="32" rx="6" fill="#0f172a" stroke="#064e3b" stroke-width="1"/>
      <text x="10" y="20" font-family="monospace" font-size="10" fill="#6ee7b7">/api/overview</text>

      <!-- Router 2 -->
      <g transform="translate(0, 38)">
        <rect width="142" height="32" rx="6" fill="#0f172a" stroke="#064e3b" stroke-width="1"/>
        <text x="10" y="20" font-family="monospace" font-size="10" fill="#6ee7b7">/api/apps</text>
      </g>

      <!-- Router 3 -->
      <g transform="translate(0, 76)">
        <rect width="142" height="32" rx="6" fill="#0f172a" stroke="#064e3b" stroke-width="1"/>
        <text x="10" y="20" font-family="monospace" font-size="10" fill="#6ee7b7">/api/categories</text>
      </g>

      <!-- Router 4 -->
      <g transform="translate(0, 114)">
        <rect width="142" height="32" rx="6" fill="#0f172a" stroke="#064e3b" stroke-width="1"/>
        <text x="10" y="20" font-family="monospace" font-size="10" fill="#6ee7b7">/api/pricing</text>
      </g>

      <!-- Router 5 -->
      <g transform="translate(0, 152)">
        <rect width="142" height="32" rx="6" fill="#0f172a" stroke="#064e3b" stroke-width="1"/>
        <text x="10" y="20" font-family="monospace" font-size="10" fill="#6ee7b7">/api/reviews</text>
      </g>

      <!-- Router 6 -->
      <g transform="translate(0, 190)">
        <rect width="142" height="32" rx="6" fill="#0f172a" stroke="#064e3b" stroke-width="1"/>
        <text x="10" y="20" font-family="monospace" font-size="10" fill="#6ee7b7">/api/coverage</text>
      </g>
    </g>
  </g>

  <!-- ==================== STAGE 5: REACT 19 FRONTEND ==================== -->
  <g transform="translate(1020, 140)" filter="url(#cardShadow)">
    <rect width="130" height="380" rx="12" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="130" height="42" rx="12" fill="#1e293b"/>
    <rect y="30" width="130" height="12" fill="#1e293b"/>
    <circle cx="24" cy="21" r="10" fill="url(#reactGrad)"/>
    <!-- Atom Glyph -->
    <ellipse cx="24" cy="21" rx="5" ry="2" stroke="#ffffff" stroke-width="0.9" fill="none" transform="rotate(30 24 21)"/>
    <ellipse cx="24" cy="21" rx="5" ry="2" stroke="#ffffff" stroke-width="0.9" fill="none" transform="rotate(-30 24 21)"/>
    <text x="40" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">React 19</text>
    <text x="12" y="66" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#06b6d4">SPA VIEWS</text>

    <!-- Views List -->
    <g transform="translate(10, 85)">
      <rect width="110" height="28" rx="5" fill="#0f172a" stroke="#164e63" stroke-width="1"/>
      <text x="8" y="18" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0">❖ Home</text>

      <g transform="translate(0, 36)">
        <rect width="110" height="28" rx="5" fill="#0f172a" stroke="#164e63" stroke-width="1"/>
        <text x="8" y="18" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0">❖ Overview</text>
      </g>

      <g transform="translate(0, 72)">
        <rect width="110" height="28" rx="5" fill="#0f172a" stroke="#164e63" stroke-width="1"/>
        <text x="8" y="18" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0">❖ Explorer</text>
      </g>

      <g transform="translate(0, 108)">
        <rect width="110" height="28" rx="5" fill="#0f172a" stroke="#164e63" stroke-width="1"/>
        <text x="8" y="18" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0">❖ Categories</text>
      </g>

      <g transform="translate(0, 144)">
        <rect width="110" height="28" rx="5" fill="#0f172a" stroke="#164e63" stroke-width="1"/>
        <text x="8" y="18" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0">❖ Pricing</text>
      </g>

      <g transform="translate(0, 180)">
        <rect width="110" height="28" rx="5" fill="#0f172a" stroke="#164e63" stroke-width="1"/>
        <text x="8" y="18" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0">❖ Reviews</text>
      </g>
    </g>
  </g>

  <!-- Bottom Legend / Status Bar -->
  <g transform="translate(50, 560)">
    <rect width="1100" height="60" rx="10" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    
    <!-- Legend 1 -->
    <circle cx="30" cy="30" r="6" fill="#95bf47"/>
    <text x="44" y="34" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Shopify App Store (25.6k target crawl)</text>

    <!-- Legend 2 -->
    <circle cx="280" cy="30" r="6" fill="#38bdf8"/>
    <text x="294" y="34" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Requests Ingestion &amp; SHA-256 Deduplication</text>

    <!-- Legend 3 -->
    <circle cx="590" cy="30" r="6" fill="#3b82f6"/>
    <text x="604" y="34" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">PostgreSQL 18.6+ (Connection Pool size=20, max_overflow=30)</text>

    <!-- Legend 4 -->
    <circle cx="970" cy="30" r="6" fill="#10b981"/>
    <text x="984" y="34" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">FastAPI REST (14 Endpoints)</text>
  </g>
</svg>
